name: Xcode - Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release__nightly:
        description: Create a nightly release
        type: boolean
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build using xcodebuild command
    runs-on: xcode-27
    env:
      scheme: OpenParsec
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}

    steps:
      - name: Verify iOS 27 SDK (iPhone Duo full-display requirement)
        run: |
          xcodebuild -version
          SDKS_DIR="$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs"
          echo "SDKs present:"
          ls "$SDKS_DIR"
          if [ -d "$SDKS_DIR/iPhoneOS27.sdk" ] || ls "$SDKS_DIR" | grep -q '^iPhoneOS27'; then
            echo "iOS 27 SDK present: app will open full-display on iPhone Duo"
          else
            echo "::error::iPhoneOS27 SDK not found on this runner. The iPhone Duo full-display build requires the xcode-27 runner (Xcode 27 / iOS 27 SDK)."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Set Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo "$scheme_list" | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo Using default scheme: $scheme
          else
            echo Using configured scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \\.xcworkspace\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \\.xcworkspace\$ || ls -A | grep -i \\.xcodeproj\$`
          file_to_build=`echo "$file_to_build" | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      - name: Set Build Number
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" OpenParsec/Info.plist
      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: |
          set -o pipefail
          xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee archive-build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-build.log
          path: archive-build.log
          if-no-files-found: warn
      - name: Verify archived app was built with iOS 27 SDK
        run: |
          APP="archive.xcarchive/Products/Applications/$scheme.app"
          if [ ! -d "$APP" ]; then echo "::error::App bundle not found at $APP"; ls -R archive.xcarchive/Products 2>/dev/null; exit 1; fi
          SDK_NAME=$(/usr/libexec/PlistBuddy -c "Print :DTSDKName" "$APP/Info.plist")
          DT_XCODE=$(/usr/libexec/PlistBuddy -c "Print :DTXcodeBuild" "$APP/Info.plist")
          echo "Archived app: DTSDKName=$SDK_NAME DTXcodeBuild=$DT_XCODE"
          case "$SDK_NAME" in
            iphoneos27*) echo "iOS 27 SDK confirmed in final app: full-display on iPhone Duo";;
            *) echo "::error::Expected iphoneos27.x SDK in final app but got '$SDK_NAME'"; exit 1;;
          esac
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
      - name: Tar Build Artifact
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar

  package:
    name: Create fake-signed ipa
    runs-on: ubuntu-latest
    needs: [build]
    env:
      scheme: ${{ needs.build.outputs.scheme }}
      archive_path: ${{ needs.build.outputs.archive_path }}
    outputs:
      artifact: ${{ env.scheme }}.ipa

    steps:
      - name: Download a Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
      - name: Extract Build Artifact
        run: tar -xf "$archive_path.xcarchive.tar"
      - name: Install ldid
        run: |
          if [ `uname -s` = "Linux" ]; then
            curl -sSL -o /usr/local/bin/ldid "${{ github.server_url }}/ProcursusTeam/ldid/releases/latest/download/ldid_linux_`uname -m`"
            chmod +x /usr/local/bin/ldid
          elif [ `uname -s` = "Darwin" ]; then
            brew install ldid
          else
            exit 1
          fi
      - name: Fakesign
        run: |
          find "$archive_path.xcarchive/Products/Applications/$scheme.app" -type d -path '*/Frameworks/*.framework' -exec ldid -S \{\} \;
          ldid -S "$archive_path.xcarchive/Products/Applications/$scheme.app"
      - name: Create IPA
        run: |
          mv "$archive_path.xcarchive/Products/Applications" Payload
          zip -r "$scheme.ipa" "Payload" -x "._*" -x ".DS_Store" -x "__MACOSX"
      - name: Verify IPA payload (SDK stamp)
        run: |
          SDK_NAME=$(python3 - "$scheme.ipa" "$scheme" <<'PYEOF'
          import sys, zipfile, plistlib
          ipa, app = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(ipa) as z:
              data = z.read(f"Payload/{app}.app/Info.plist")
          print(plistlib.loads(data).get("DTSDKName", "") or "")
          PYEOF
          )
          echo "IPA DTSDKName: ${SDK_NAME:-<not found>}"
          case "$SDK_NAME" in
            iphoneos27*) echo "iOS 27 SDK confirmed in IPA";;
            *) echo "::error::Expected iphoneos27.x SDK in IPA but got '$SDK_NAME'"; exit 1;;
          esac
          ls -la "$scheme.ipa"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.scheme }}.ipa
          path: ${{ env.scheme }}.ipa

  release__nightly:
    name: Nightly Release
    permissions:
      contents: write
    if: false
    runs-on: ubuntu-latest
    needs: [package]
    concurrency:
      group: release__nightly
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download a Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
      - name: Nightly Release
        uses: andelf/nightly-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            This is a nightly release [created automatically with GitHub Actions workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}).
          files: |
            ${{ needs.package.outputs.artifact }}
